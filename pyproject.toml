[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "littlesqrt"
version = "2.0.1"
description = "BS.1770-oriented loudness measurement and normalization utility"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]

[project.scripts]
littlesqrt = "littlesqrt:main"

[tool.pytest.ini_options]
pythonpath = ["."]
